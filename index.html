<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DO">
  <meta name="theme-color" content="#0e0e0e">
  <title>DO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0e0e0e; --s1:#161616; --s2:#1e1e1e; --bd:#272727;
      --y:#A78BFA; --yd:rgba(167,139,250,.13);
      --tx:#dedede; --mu:#4a4a4a;
      --gr:#5cdb7d; --re:#e06060;
      --mono:'JetBrains Mono','Courier New',monospace;
      --head:'Syne',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{height:100%}
    body{background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:14px;
         height:100%;overscroll-behavior:none}

    /* ── Screens ── */
    .scr{display:none;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
         padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    .scr.on{display:block}
    #s-home{padding-top:env(safe-area-inset-top)}

    /* ── Sticky sub-screen header ── */
    .hd{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);
        padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
        display:flex;align-items:center;gap:14px;z-index:10}
    .hd-back{background:none;border:none;color:var(--y);font:400 12px/1 var(--mono);cursor:pointer;letter-spacing:.06em;padding:4px 0}
    .hd-title{font:800 15px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;flex:1}
    .hd-action{background:none;border:none;color:var(--mu);font:400 11px/1 var(--mono);cursor:pointer;letter-spacing:.06em;padding:4px 0;transition:color .12s}
    .hd-action:active{color:var(--y)}

    /* ── Home top ── */
    .h-top{padding:calc(env(safe-area-inset-top) + 28px) 18px 0;position:relative}
    .h-label{font:700 10px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
    .h-logo-row{display:flex;align-items:center;justify-content:space-between;gap:14px;
                flex-wrap:wrap;margin-bottom:28px}
    .h-logo{font:800 48px/1 var(--head);letter-spacing:-.02em}
    .h-logo em{color:var(--y);font-style:normal}

    /* ── Daily / Other tab selector ── */
    .tabs{position:relative;display:inline-flex;background:var(--s1);
          border:1px solid var(--bd);border-radius:7px;padding:3px}
    .tab-glider{position:absolute;top:3px;bottom:3px;left:0;width:0;background:var(--y);
                border-radius:5px;z-index:1;
                transition:transform .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1)}
    .tab{position:relative;z-index:2;background:none;border:none;cursor:pointer;
         font:700 10px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;
         color:var(--mu);padding:9px 15px;border-radius:5px;transition:color .25s}
    .tab.active{color:#0e0e0e}
    .h-settings-btn{position:absolute;top:calc(env(safe-area-inset-top) + 28px);right:18px;
                    background:none;border:none;color:var(--mu);font:400 11px/1 var(--mono);
                    cursor:pointer;letter-spacing:.06em;padding:4px 0;transition:color .12s}
    .h-settings-btn:active{color:var(--y)}

    /* ── Card grid ── */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px}
    .card{background:var(--s1);border:1px solid var(--bd);border-radius:4px;
          padding:18px 15px 14px;cursor:pointer;position:relative;
          transition:border-color .12s;user-select:none}
    .card:active{background:var(--s2)}
    .card.done{border-color:var(--y)}
    .card.done::after{content:'✓';position:absolute;top:11px;right:13px;
                      font:11px/1 var(--mono);color:var(--y)}
    .card-t{font:700 13px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
    .card-s{font:400 10px/1.4 var(--mono);color:var(--mu);letter-spacing:.04em;margin-bottom:12px}
    .card-bar{height:2px;background:var(--bd);border-radius:1px;overflow:hidden}
    .card-bar-fill{height:100%;background:var(--y);border-radius:1px;transition:width .25s ease}
    .card.done .card-bar-fill{background:var(--gr)}

    /* ── Checklist screen ── */
    .cnt{padding:18px}
    .cl-progress{margin-bottom:16px}
    .cl-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-bottom:8px}
    .cl-bar-fill{height:100%;background:var(--y);border-radius:2px;transition:width .25s ease}
    .cl-progress.all-done .cl-bar-fill{background:var(--gr)}
    .cl-stats{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.06em}
    .cl-stats em{color:var(--y);font-style:normal}
    .cl-progress.all-done .cl-stats em{color:var(--gr)}

    /* ── Item toggle buttons ── */
    .item-btn{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:3px;
              color:var(--mu);font:400 13px/1 var(--mono);letter-spacing:.05em;
              padding:15px 14px;cursor:pointer;text-align:left;
              display:flex;align-items:center;justify-content:space-between;
              margin-bottom:6px;transition:all .1s}
    .item-btn:active{background:var(--s2)}
    .item-btn.checked{background:var(--yd);border-color:var(--y);color:var(--tx)}
    .item-check-ico{width:18px;height:18px;border-radius:3px;border:1.5px solid var(--bd);
                    flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .item-btn.checked .item-check-ico{background:var(--y);border-color:var(--y)}
    .item-check-svg{width:10px;height:10px;opacity:0;transition:opacity .1s}
    .item-btn.checked .item-check-svg{opacity:1}

    /* ── Done banner ── */
    .done-banner{background:rgba(92,219,125,.07);border:1px solid rgba(92,219,125,.2);
                 border-radius:4px;font:400 11px/1.6 var(--mono);color:var(--gr);
                 letter-spacing:.06em;text-align:center;padding:14px;margin-bottom:14px;display:none}
    .done-banner.show{display:block}

    /* ── Settings ── */
    .sec{font:700 10px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;color:var(--y);
         margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
    .setting-row{display:flex;align-items:center;justify-content:space-between;
                 background:var(--s1);border:1px solid var(--bd);border-radius:3px;
                 padding:13px 14px;margin-bottom:8px}
    .setting-lbl{font:400 11px/1 var(--mono);letter-spacing:.06em;color:var(--mu)}
    .setting-btn{background:var(--s2);border:1px solid var(--bd);border-radius:3px;
                 color:var(--tx);font:400 10px/1 var(--mono);letter-spacing:.08em;
                 padding:9px 13px;cursor:pointer;transition:all .12s;white-space:nowrap}
    .setting-btn:active{border-color:var(--y);color:var(--y)}
    .setting-btn.danger{color:var(--re)}
    .setting-btn.danger:active{border-color:var(--re)}
    .data-warn{font:400 10px/1.6 var(--mono);color:var(--mu);padding:12px 14px;margin-bottom:16px;
               background:var(--s1);border:1px solid var(--bd);border-radius:3px}

    /* ── Travel ── */
    .tv-sec{font:700 10px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;color:var(--y);
            margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bd);
            display:flex;align-items:center;justify-content:space-between}
    .tv-sec:first-child{margin-top:0}
    .tv-sec-act{background:none;border:none;color:var(--mu);font:400 9px/1 var(--mono);
                letter-spacing:.08em;cursor:pointer;padding:2px 0;text-transform:uppercase}
    .tv-sec-act:active{color:var(--y)}
    .tv-item{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:3px;
             color:var(--mu);font:400 13px/1 var(--mono);letter-spacing:.05em;
             padding:13px 14px;cursor:pointer;text-align:left;
             display:flex;align-items:center;gap:11px;
             margin-bottom:6px;transition:all .1s}
    .tv-item:active{background:var(--s2)}
    .tv-item.checked{background:var(--yd);border-color:var(--y);color:var(--tx)}
    .tv-count-grp{display:flex;align-items:center;gap:3px;flex-shrink:0}
    .tv-step{background:var(--s2);border:1px solid var(--bd);border-radius:3px;
             font:700 14px/1 var(--mono);color:var(--mu);
             padding:7px 9px;min-width:28px;text-align:center;cursor:pointer;
             transition:all .1s;user-select:none}
    .tv-step:active{color:var(--y);border-color:var(--y)}
    .tv-step.disabled{opacity:.25;pointer-events:none}
    .tv-num{font:700 11px/1 var(--mono);color:var(--y);letter-spacing:.04em;
            padding:0 2px;min-width:18px;text-align:center;user-select:none}
    .tv-item.checked .tv-num{color:var(--tx)}
    .tv-name{flex:1;min-width:0;word-break:break-word}
    .tv-rm{background:none;border:none;color:var(--mu);font:400 13px/1 var(--mono);
           cursor:pointer;padding:4px 6px;flex-shrink:0;transition:color .1s}
    .tv-rm:active{color:var(--re)}
    .tv-check{width:18px;height:18px;border-radius:3px;border:1.5px solid var(--bd);
              flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .tv-item.checked .tv-check{background:var(--y);border-color:var(--y)}
    .tv-check-svg{width:10px;height:10px;opacity:0;transition:opacity .1s}
    .tv-item.checked .tv-check-svg{opacity:1}

    /* clothes editor row */
    .tv-edit-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
    .tv-edit-input{background:var(--s1);border:1px solid var(--bd);border-radius:3px;
                   color:var(--tx);font:400 13px/1 var(--mono);padding:11px 12px;outline:none;
                   -webkit-appearance:none;transition:border-color .12s;width:100%}
    .tv-edit-input:focus{border-color:var(--y)}
    .tv-edit-add{background:var(--y);border:none;border-radius:3px;color:#0e0e0e;
                 font:700 11px/1 var(--mono);letter-spacing:.06em;padding:11px 14px;
                 cursor:pointer;white-space:nowrap}
    .tv-edit-add:active{opacity:.82}
    .tv-edit-item{background:var(--s1);border:1px solid var(--bd);border-radius:3px;
                  padding:9px 12px;margin-bottom:5px;display:grid;
                  grid-template-columns:1fr auto;gap:10px;align-items:center}
    .tv-edit-item-txt{font:400 12px/1 var(--mono);color:var(--tx)}
    .tv-edit-del{background:none;border:none;color:var(--mu);font:400 13px/1 var(--mono);
                 cursor:pointer;padding:2px}
    .tv-edit-del:active{color:var(--re)}

    /* travel: checklist list cards */
    .tv-list-card{background:var(--s1);border:1px solid var(--bd);border-radius:4px;
                  padding:16px 15px 14px;margin-bottom:8px;cursor:pointer;
                  transition:border-color .12s}
    .tv-list-card:active{background:var(--s2)}
    .tv-list-card.done{border-color:var(--gr)}
    .tv-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
    .tv-list-name{font:700 13px/1 var(--head);letter-spacing:.08em;text-transform:uppercase}
    .tv-list-del{background:none;border:none;color:var(--mu);font:400 13px/1 var(--mono);
                 cursor:pointer;padding:2px 4px}
    .tv-list-del:active{color:var(--re)}
    .tv-empty{font:400 11px/1.7 var(--mono);color:var(--mu);letter-spacing:.04em;
              text-align:center;padding:40px 20px}

    /* travel: category selector */
    .tv-cat-row{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:3px;
                color:var(--mu);font:400 13px/1 var(--mono);letter-spacing:.05em;
                padding:14px;cursor:pointer;text-align:left;
                display:flex;align-items:center;gap:11px;margin-bottom:6px;transition:all .1s}
    .tv-cat-row:active{background:var(--s2)}
    .tv-cat-row.on{background:var(--yd);border-color:var(--y);color:var(--tx)}
    .tv-cat-name{flex:1;text-transform:capitalize}
    .tv-cat-count{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.04em}
    .tv-cat-row.on .tv-cat-count{color:var(--y)}
    .tv-cat-row.on .tv-check{background:var(--y);border-color:var(--y)}
    .tv-cat-row.on .tv-check-svg{opacity:1}

    /* toast */
    .toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
           transform:translateX(-50%) translateY(120px);background:var(--y);color:#0e0e0e;
           font:700 11px/1 var(--mono);letter-spacing:.08em;padding:9px 18px;border-radius:3px;
           transition:transform .18s ease;z-index:99;pointer-events:none;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<!-- ═══ HOME ════════════════════════════════════════════════════════════════ -->
<div id="s-home" class="scr on">
  <div class="h-top">
    <div class="h-label" id="date-label">—</div>
    <div class="h-logo-row">
      <div class="h-logo">DO<em>.</em></div>
      <div class="tabs" id="home-tabs">
        <div class="tab-glider" id="tab-glider"></div>
        <button class="tab active" data-tab="daily" onclick="setTab('daily')">daily</button>
        <button class="tab" data-tab="other" onclick="setTab('other')">other</button>
      </div>
    </div>
    <button class="h-settings-btn" onclick="go('settings')">settings</button>
  </div>
  <div class="grid" id="home-grid"></div>
</div>

<!-- ═══ CHECKLIST ════════════════════════════════════════════════════════════ -->
<div id="s-checklist" class="scr">
  <div class="hd">
    <button class="hd-back" onclick="go('home')">← back</button>
    <span class="hd-title" id="cl-title">—</span>
    <button class="hd-action" id="cl-action-btn" onclick="toggleAll()">mark all</button>
  </div>
  <div class="cnt">
    <div class="cl-progress" id="cl-progress">
      <div class="cl-bar"><div class="cl-bar-fill" id="cl-bar-fill" style="width:0%"></div></div>
      <div class="cl-stats" id="cl-stats"><em>0</em> / 0</div>
    </div>
    <div class="done-banner" id="cl-done-banner">all done ✓</div>
    <div id="cl-items"></div>
  </div>
</div>

<!-- ═══ TRAVEL — list of checklists ═══════════════════════════════════════════ -->
<div id="s-travel" class="scr">
  <div class="hd">
    <button class="hd-back" onclick="go('home')">← back</button>
    <span class="hd-title">Travel</span>
    <button class="hd-action" onclick="go('travel-new')">+ new</button>
  </div>
  <div class="cnt">
    <div id="tv-lists"></div>
  </div>
</div>

<!-- ═══ TRAVEL — new checklist setup ══════════════════════════════════════════ -->
<div id="s-travel-new" class="scr">
  <div class="hd">
    <button class="hd-back" onclick="go('travel')">← back</button>
    <span class="hd-title">New List</span>
    <button class="hd-action" onclick="createList()">create</button>
  </div>
  <div class="cnt">
    <input type="text" id="tv-new-name" class="tv-edit-input" placeholder="checklist name…" style="margin-bottom:18px">
    <div class="sec">Categories</div>
    <div id="tv-cat-select"></div>
  </div>
</div>

<!-- ═══ TRAVEL — single checklist ═════════════════════════════════════════════ -->
<div id="s-travel-cl" class="scr">
  <div class="hd">
    <button class="hd-back" onclick="go('travel')">← back</button>
    <span class="hd-title" id="tv-cl-title">—</span>
    <button class="hd-action" onclick="exportTravelMd()">export</button>
  </div>
  <div class="cnt">
    <div class="cl-progress" id="tv-progress">
      <div class="cl-bar"><div class="cl-bar-fill" id="tv-bar-fill" style="width:0%"></div></div>
      <div class="cl-stats" id="tv-stats"><em>0</em> / 0</div>
    </div>
    <div class="done-banner" id="tv-done-banner">all packed ✓</div>
    <div id="tv-sections"></div>
  </div>
</div>

<!-- ═══ TRAVEL EDIT ══════════════════════════════════════════════════════════ -->
<div id="s-travel-edit" class="scr">
  <div class="hd">
    <button class="hd-back" onclick="go('travel-cl')">← back</button>
    <span class="hd-title" id="tv-edit-title">Edit</span>
    <button class="hd-action" onclick="saveTravelEdit()">save</button>
  </div>
  <div class="cnt">
    <div class="tv-edit-row">
      <input type="text" id="tv-edit-input" class="tv-edit-input" placeholder="add item…">
      <button class="tv-edit-add" onclick="addEditItem()">+ add</button>
    </div>
    <div id="tv-edit-list"></div>
  </div>
</div>

<!-- ═══ SETTINGS ════════════════════════════════════════════════════════════ -->
<div id="s-settings" class="scr">
  <div class="hd">
    <button class="hd-back" onclick="go('home')">← back</button>
    <span class="hd-title">Settings</span>
  </div>
  <div class="cnt">
    <div class="sec">App</div>
    <div class="data-warn">Data is stored locally on this device and resets automatically each day.</div>
    <div class="setting-row">
      <span class="setting-lbl">Reload page</span>
      <button class="setting-btn" onclick="window.location.reload()">reload</button>
    </div>
    <div class="setting-row">
      <span class="setting-lbl">Reset today's progress</span>
      <button class="setting-btn danger" onclick="resetDay()">reset</button>
    </div>
    <div class="setting-row">
      <span class="setting-lbl">Reset travel list</span>
      <button class="setting-btn danger" onclick="resetTravel()">reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Daily lists mirror system_tool_do.md. Glyph prefixes match the app's existing
// visual language — the words after them are the file's, verbatim.
const ROUTINES = {
  routinep1: { label: 'Routine P1', items: ['≈ shower','≋ teeth','◡ cream','○ breakfast p1','✚ meds','↑ walk kamo','▲ gym'] },
  routinep2: { label: 'Routine P2', items: ['○ breakfast p2','≡ morning log','≡ log meds','✎ journal entry'] },
  routinep3: { label: 'Routine P3', items: ['◐ lunch p1','✎ journal entry','✦ feed kamo','≈ fill kamo water','◐ lunch p2','↑ kamo walk'] },
  routinep4: { label: 'Routine P4', items: ['≡ evening log','✎ journal entry','▤ plan blocks','▦ schedule','○ cleanup / dishes'] },
  cooldown:  { label: 'Cooldown',   items: ['▭ bed out','≈ fill water','≋ teeth','◇ tongue','◡ cream'] },
  cleanup:   { label: 'Cleanup',    items: ['○ dishes','✿ plants','⟳ vacuum','⊞ tidy up','✕ trash/recycle'] },
  deepclean: { label: 'Deep Clean', items: ['≋ dusting','⟳ vacuum','▧ mop','▭ surfaces','≈ bathroom sink','○ toilet','✕ trash'] },
};

// Travel: master categories. Every item is a counter that starts at 1.
// A new checklist is built by picking which categories to include.
const TRAVEL_CATEGORIES = {
  clothes:     ['shirts','boxers','short socks','long socks','sweatpant','pants','shorts','sweater','swim trunks','rain coat','belt','jacket','packing cubes'],
  toiletries:  ['toothbrush','toothbrush charger','toothpaste','face cream','eye cream','soap tube','facewash tube','shampoo tube','deodorant','gel','towel','nail care','nail file','nail cutter','talc','wash cloth','hygiene wipes','razor','razor charger'],
  meds:        ['lamotrigine','ritalin','caffeine pill','vitamins','biseptine','disenfectant','cottons','sunscreen','band aids'],
  electronics: ['phone','watch','headset','earphones','portable speaker','usb a plug','usb a to c','usb c to c','usb a to micro','watch cable','charge block','usb a fast power','mac','mac charger','laptop','laptop charger','laptop pounch','battery bank small','battery bank big','controller','headphones (dj)'],
  kamo:        ['toys','croquette bag','treats','black leash','long leash','towel','duvet','frontale','harness','poop bag','bowls','cold mat','kamo id'],
  essentials:  ['id','wallet','tissues','chapstick','ecig','ecig juice','water bottle','slippers','sunglasses','extra shoes','hand sanitizer','passport'],
  rave:        ['rave pants','earplugs','stickers','big satchel','rave shirt','bucket hat','spoon','pill','vacuum','polaroid','usb','dummy charger'],
  festival:    ['tent','sardines','party tent','chairs','table','matress','pillows','duvet','bedsheet','cart','cart screws','key','tarp','elastic cables','camelback','water pouch','boots','electric pump','wet wipes','toilet paper','trash bags','lighter','duct tape','rubber mallet'],
};
const CATEGORY_ORDER = ['clothes','toiletries','meds','electronics','kamo','essentials','rave','festival'];
const TRAVEL_KEY = 'travel_state_v2';

const TODAY = new Date().toISOString().split('T')[0];
const SK = 'do_' + TODAY;

// Which routines live under each home tab. Travel is shown under "other".
const TAB_ROUTINES = {
  daily: ['routinep1', 'routinep2', 'routinep3', 'routinep4', 'cooldown', 'cleanup'],
  other: ['deepclean'],
};

let state = {};
let currentRoutine = null;
let currentTab = 'daily';
let travel = null;        // { lists:{id:{...}}, order:[id,...] }
let currentList = null;   // id of the open checklist
let editSection = null;
let newCats = new Set();  // categories selected on the new-checklist screen

// Derived from ROUTINES so adding a list never needs this kept in step.
function blankState() {
  return Object.fromEntries(Object.keys(ROUTINES).map(k => [k, {}]));
}

function loadState() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) { state = JSON.parse(raw); }
    else {
      Object.keys(localStorage).filter(k => k.startsWith('do_') && k !== SK)
        .forEach(k => localStorage.removeItem(k));
      state = blankState();
    }
  } catch { state = blankState(); }
  loadTravel();
}

function saveState() { localStorage.setItem(SK, JSON.stringify(state)); }

function loadTravel() {
  try {
    const raw = localStorage.getItem(TRAVEL_KEY);
    if (raw) { travel = JSON.parse(raw); }
  } catch {}
  if (!travel || !travel.lists) {
    travel = { lists:{}, order:[] };
    migrateLegacyTravel();
  }
  travel.lists = travel.lists || {};
  travel.order = travel.order || Object.keys(travel.lists);
}

// pull a single saved checklist out of the old v1 format, if present
function migrateLegacyTravel() {
  let old = null;
  try { old = JSON.parse(localStorage.getItem('travel_state_v1') || 'null'); } catch {}
  if (!old || !old.sections) return;
  const list = newListObj('My Trip');
  const stripPrefix = s => s.replace(/^(x|\d+)\s+/i, '');
  Object.keys(old.sections).forEach(sec => {
    const items = (old.sections[sec] || []).map(stripPrefix);
    list.sections[sec] = items;
    (old.sections[sec] || []).forEach((raw, i) => {
      const name = items[i];
      const k = itemKey(sec, name);
      if (old.checked && old.checked[itemKey(sec, raw)]) list.checked[k] = true;
      const oldCount = (old.counts && old.counts[itemKey(sec, raw)]) ||
                       (raw.match(/^(\d+)\s+/) ? parseInt(raw, 10) : 1);
      if (oldCount > 1) list.counts[k] = oldCount;
    });
  });
  travel.lists[list.id] = list;
  travel.order.push(list.id);
}

function newListObj(name) {
  return { id: 'l' + Date.now() + Math.floor(Math.random()*1000),
           name, created: Date.now(), sections:{}, checked:{}, counts:{} };
}

function saveTravel() { localStorage.setItem(TRAVEL_KEY, JSON.stringify(travel)); }

function toggle(key, item) {
  if (!state[key]) state[key] = {};
  state[key][item] = !state[key][item];
  saveState();
  renderChecklist();
  renderHome();
}

function go(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + id).classList.add('on');
  window.scrollTo(0, 0);
  if (id === 'home') renderHome();
  if (id === 'checklist') renderChecklist();
  if (id === 'travel') renderTravelList();
  if (id === 'travel-new') renderTravelNew();
  if (id === 'travel-cl') renderTravelCl();
  if (id === 'travel-edit') renderTravelEdit();
}

function openRoutine(key) {
  currentRoutine = key;
  document.getElementById('cl-title').textContent = ROUTINES[key].label;
  go('checklist');
}

function renderHome() {
  document.getElementById('date-label').textContent =
    new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).toUpperCase();

  const routineCards = (TAB_ROUTINES[currentTab] || []).map(key => {
    const r = ROUTINES[key];
    const done = r.items.filter(i => state[key]?.[i]).length;
    const pct  = r.items.length ? Math.round((done / r.items.length) * 100) : 0;
    const isDone = done === r.items.length;
    return `<div class="card${isDone ? ' done' : ''}" onclick="openRoutine('${key}')">
      <div class="card-t">${r.label}</div>
      <div class="card-s">${done} / ${r.items.length} done</div>
      <div class="card-bar"><div class="card-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  let travelCard = '';
  if (currentTab === 'other') {
    const tStat = travelStatsAll();
    const tDone = tStat.done === tStat.total && tStat.total > 0;
    const n = travel.order.length;
    const sub = n === 0 ? 'no checklists yet'
                        : `${n} list${n>1?'s':''} · ${tStat.done} / ${tStat.total} packed`;
    travelCard = `<div class="card${tDone ? ' done' : ''}" onclick="go('travel')">
      <div class="card-t">Travel</div>
      <div class="card-s">${sub}</div>
      <div class="card-bar"><div class="card-bar-fill" style="width:${tStat.pct}%"></div></div>
    </div>`;
  }

  document.getElementById('home-grid').innerHTML = routineCards + travelCard;
}

function setTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;
  document.querySelectorAll('#home-tabs .tab')
    .forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  positionGlider();
  renderHome();
}

function positionGlider() {
  const active = document.querySelector('#home-tabs .tab.active');
  const glider = document.getElementById('tab-glider');
  if (!active || !glider) return;
  glider.style.width = active.offsetWidth + 'px';
  glider.style.transform = `translateX(${active.offsetLeft}px)`;
}

function listStats(list) {
  let done = 0, total = 0;
  Object.keys(list.sections).forEach(sec => {
    (list.sections[sec] || []).forEach(item => {
      total++;
      if (list.checked[itemKey(sec, item)]) done++;
    });
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  return { done, total, pct };
}

function travelStatsAll() {
  let done = 0, total = 0;
  travel.order.forEach(id => {
    const s = listStats(travel.lists[id]);
    done += s.done; total += s.total;
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  return { done, total, pct };
}

function itemKey(sec, item) { return sec + '::' + item; }
function sectionOrder(list) {
  const keys = Object.keys(list.sections);
  return keys.sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}

function renderChecklist() {
  if (!currentRoutine) return;
  const key   = currentRoutine;
  const items = ROUTINES[key].items;
  const done  = items.filter(i => state[key]?.[i]).length;
  const pct   = items.length ? Math.round((done / items.length) * 100) : 0;
  const allDone = done === items.length;

  document.getElementById('cl-progress').classList.toggle('all-done', allDone);
  document.getElementById('cl-bar-fill').style.width = pct + '%';
  document.getElementById('cl-stats').innerHTML = `<em>${done}</em> / ${items.length}`;
  document.getElementById('cl-done-banner').classList.toggle('show', allDone);
  document.getElementById('cl-action-btn').textContent = allDone ? 'clear all' : 'mark all';

  document.getElementById('cl-items').innerHTML = items.map(item => {
    const checked = !!state[key]?.[item];
    const safeItem = item.replace(/'/g, "\\'");
    return `<button class="item-btn${checked ? ' checked' : ''}" onclick="toggle('${key}','${safeItem}')">
      <span>${item}</span>
      <div class="item-check-ico">
        <svg class="item-check-svg" viewBox="0 0 10 10" fill="none">
          <path d="M1.5 5L4 7.5L8.5 2.5" stroke="#0e0e0e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>`;
  }).join('');
}

function toggleAll() {
  if (!currentRoutine) return;
  const key   = currentRoutine;
  const items = ROUTINES[key].items;
  const done  = items.filter(i => state[key]?.[i]).length;
  const allDone = done === items.length;
  if (!state[key]) state[key] = {};
  items.forEach(i => { state[key][i] = !allDone; });
  saveState();
  renderChecklist();
  renderHome();
}

function resetDay() {
  if (!confirm('Reset all items for today?')) return;
  state = blankState();
  saveState();
  go('home');
}

// ── Travel ────────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// list of saved checklists
function renderTravelList() {
  const box = document.getElementById('tv-lists');
  if (!travel.order.length) {
    box.innerHTML = `<div class="tv-empty">No checklists yet.<br>Tap “+ new” to create one.</div>`;
    return;
  }
  box.innerHTML = travel.order.map(id => {
    const list = travel.lists[id];
    const s = listStats(list);
    const done = s.done === s.total && s.total > 0;
    return `<div class="tv-list-card${done ? ' done' : ''}" onclick="openList('${id}')">
      <div class="tv-list-head">
        <span class="tv-list-name">${esc(list.name)}</span>
        <button class="tv-list-del" onclick="event.stopPropagation();deleteList('${id}')">✕</button>
      </div>
      <div class="card-s">${s.done} / ${s.total} packed</div>
      <div class="card-bar"><div class="card-bar-fill" style="width:${s.pct}%"></div></div>
    </div>`;
  }).join('');
}

function openList(id) { currentList = id; go('travel-cl'); }

function deleteList(id) {
  const list = travel.lists[id];
  if (!confirm('Delete “' + (list ? list.name : 'this list') + '”?')) return;
  delete travel.lists[id];
  travel.order = travel.order.filter(x => x !== id);
  if (currentList === id) currentList = null;
  saveTravel();
  renderTravelList();
  renderHome();
}

// new-checklist setup: name + category selector
function renderTravelNew() {
  newCats = new Set();
  document.getElementById('tv-new-name').value = '';
  document.getElementById('tv-cat-select').innerHTML = CATEGORY_ORDER.map(cat => {
    const n = TRAVEL_CATEGORIES[cat].length;
    return `<button class="tv-cat-row" id="cat-${cat}" onclick="toggleCat('${cat}')">
      <span class="tv-cat-name">${cat}</span>
      <span class="tv-cat-count">${n} items</span>
      <div class="tv-check">
        <svg class="tv-check-svg" viewBox="0 0 10 10" fill="none">
          <path d="M1.5 5L4 7.5L8.5 2.5" stroke="#0e0e0e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>`;
  }).join('');
}

function toggleCat(cat) {
  if (newCats.has(cat)) newCats.delete(cat); else newCats.add(cat);
  const el = document.getElementById('cat-' + cat);
  if (el) el.classList.toggle('on', newCats.has(cat));
}

function createList() {
  if (!newCats.size) { toast('pick a category'); return; }
  const name = document.getElementById('tv-new-name').value.trim() || 'My Trip';
  const list = newListObj(name);
  CATEGORY_ORDER.forEach(cat => {
    if (newCats.has(cat)) list.sections[cat] = [...TRAVEL_CATEGORIES[cat]];
  });
  travel.lists[list.id] = list;
  travel.order.push(list.id);
  saveTravel();
  currentList = list.id;
  renderHome();
  go('travel-cl');
}

// single checklist
function curList() { return travel.lists[currentList]; }
function itemCount(list, key) { return list.counts[key] ?? 1; }

function renderTravelCl() {
  const list = curList();
  if (!list) { go('travel'); return; }
  document.getElementById('tv-cl-title').textContent = list.name;
  const stat = listStats(list);
  const allDone = stat.done === stat.total && stat.total > 0;
  document.getElementById('tv-progress').classList.toggle('all-done', allDone);
  document.getElementById('tv-bar-fill').style.width = stat.pct + '%';
  document.getElementById('tv-stats').innerHTML = `<em>${stat.done}</em> / ${stat.total}`;
  document.getElementById('tv-done-banner').classList.toggle('show', allDone);

  document.getElementById('tv-sections').innerHTML = sectionOrder(list).map(sec => {
    const items = list.sections[sec] || [];
    const headAction = `<button class="tv-sec-act" onclick="openTravelEdit('${sec}')">+ add</button>`;
    const rows = items.map(item => {
      const key = itemKey(sec, item);
      const checked = !!list.checked[key];
      const n = itemCount(list, key);
      const decDisabled = n <= 1 ? ' disabled' : '';
      const safeItem = item.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      return `<button class="tv-item${checked ? ' checked' : ''}" onclick="toggleTravel('${sec}','${safeItem}')">
        <span class="tv-count-grp" onclick="event.stopPropagation()">
          <span class="tv-step${decDisabled}" onclick="event.stopPropagation();decCount('${sec}','${safeItem}')">−</span>
          <span class="tv-num">${n}</span>
          <span class="tv-step" onclick="event.stopPropagation();bumpCount('${sec}','${safeItem}')">+</span>
        </span>
        <span class="tv-name">${esc(item)}</span>
        <span class="tv-rm" onclick="event.stopPropagation();removeItem('${sec}','${safeItem}')">✕</span>
        <div class="tv-check">
          <svg class="tv-check-svg" viewBox="0 0 10 10" fill="none">
            <path d="M1.5 5L4 7.5L8.5 2.5" stroke="#0e0e0e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>`;
    }).join('');
    return `<div class="tv-sec"><span>${sec}</span>${headAction}</div>${rows}`;
  }).join('');
}

function toggleTravel(sec, item) {
  const list = curList(); if (!list) return;
  const key = itemKey(sec, item);
  list.checked[key] = !list.checked[key];
  saveTravel();
  renderTravelCl();
}

function bumpCount(sec, item) {
  const list = curList(); if (!list) return;
  const key = itemKey(sec, item);
  list.counts[key] = itemCount(list, key) + 1;
  saveTravel();
  renderTravelCl();
}

function decCount(sec, item) {
  const list = curList(); if (!list) return;
  const key = itemKey(sec, item);
  const cur = itemCount(list, key);
  if (cur <= 1) return;
  if (cur - 1 <= 1) delete list.counts[key]; else list.counts[key] = cur - 1;
  saveTravel();
  renderTravelCl();
}

function removeItem(sec, item) {
  const list = curList(); if (!list) return;
  const arr = list.sections[sec] || [];
  const idx = arr.indexOf(item);
  if (idx < 0) return;
  arr.splice(idx, 1);
  delete list.checked[itemKey(sec, item)];
  delete list.counts[itemKey(sec, item)];
  saveTravel();
  renderTravelCl();
}

function openTravelEdit(sec) { editSection = sec; go('travel-edit'); }

function renderTravelEdit() {
  const list = curList();
  if (!list) { go('travel'); return; }
  if (!editSection || !list.sections[editSection]) editSection = sectionOrder(list)[0] || 'clothes';
  document.getElementById('tv-edit-title').textContent = 'Add to ' + editSection;
  const items = list.sections[editSection] || [];
  document.getElementById('tv-edit-list').innerHTML = items.map((item, i) => `
    <div class="tv-edit-item">
      <span class="tv-edit-item-txt">${esc(item)}</span>
      <button class="tv-edit-del" onclick="deleteEditItem(${i})">✕</button>
    </div>`).join('');
  document.getElementById('tv-edit-input').value = '';
}

function addEditItem() {
  const list = curList(); if (!list) return;
  const inp = document.getElementById('tv-edit-input');
  const txt = inp.value.trim();
  if (!txt) return;
  if (!list.sections[editSection]) list.sections[editSection] = [];
  if (!list.sections[editSection].includes(txt)) list.sections[editSection].push(txt);
  saveTravel();
  renderTravelEdit();
}

function deleteEditItem(i) {
  const list = curList(); if (!list) return;
  const item = list.sections[editSection][i];
  list.sections[editSection].splice(i, 1);
  delete list.checked[itemKey(editSection, item)];
  delete list.counts[itemKey(editSection, item)];
  saveTravel();
  renderTravelEdit();
}

function saveTravelEdit() {
  saveTravel();
  toast(editSection + ' saved');
  go('travel-cl');
}

function resetTravel() {
  if (!confirm('Delete ALL travel checklists? This cannot be undone.')) return;
  localStorage.removeItem(TRAVEL_KEY);
  localStorage.removeItem('travel_state_v1');
  travel = { lists:{}, order:[] };
  saveTravel();
  currentList = null;
  toast('travel reset');
  go('home');
}

function exportTravelMd() {
  const list = curList();
  if (!list) return;
  const lines = [];
  sectionOrder(list).forEach(sec => {
    lines.push('#### ' + sec);
    (list.sections[sec] || []).forEach(item => {
      const key = itemKey(sec, item);
      const mark = list.checked[key] ? 'x' : ' ';
      const n = itemCount(list, key);
      const body = n > 1 ? `${n} ${item}` : item;   // count hidden when 1
      lines.push(`- [${mark}] ${body}`);
    });
    lines.push('');
  });
  const md = lines.join('\n');
  const date = new Date().toISOString().split('T')[0];
  const slug = (list.name || 'travel').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'travel';
  const filename = `${slug}_${date}.md`;
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('exported ' + filename);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

loadState();
renderHome();
positionGlider();
</script>
</body>
</html>
